const alMs=()=>{const c=S.cfg?.alerta||{},v=+c.valor;return v>0?v*(UN[c.unidade]||36e5):0};
const alTxt=()=>{const c=S.cfg?.alerta||{},v=+c.valor,u=UL[c.unidade]||UL.horas;return v+' '+(v===1?u[0]:u[1])};
const alInfo=x=>{
  if(x.prioridade==='SIM')return{m:1,t:String(x.alertaMotivo||'').trim()||'Sem motivo informado'};
  const ms=alMs(),t0=new Date(x.data||0).getTime();
  if(ms&&t0>0&&Date.now()-t0>=ms)return{m:0,t:'Alerta automático: demanda aberta há mais de '+alTxt()};
  return null;
};
function rows(){

  if(t==='condominios'){const o=new Set(Object.values(S.ab).map(d=>d.condominio+'|'+d.uf));return arr(S.co).filter(x=>hit(x,q)&&(!S.uf||x.uf===S.uf)&&(S.cf!=='ab'||o.has(x.nome+'|'+x.uf))).sort((a,b)=>a.nome.localeCompare(b.nome))}
  if(t==='problemas'){const reg=new Map(arr(S.pb).map(p=>[p.nome,p.id]));return probNames().filter(n=>!q||n.toLowerCase().includes(q)).map(n=>({id:reg.get(n)||'',nome:n}))}
  if(t==='responsaveis')return arr(S.rs).filter(x=>hit(x,q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(t==='usuarios')return arr(S.us).filter(x=>hit({n:x.nome,e:x.email},q));
  {const[a,b]=rng();return arr(S.lg).filter(x=>{const m=new Date(x.t).getTime();return hit(x,q)&&(!S.ac||TIPOS[S.ac].test(x.a||''))&&(!S.lu||x.u===S.lu)&&m>=a&&m<=b}).sort((a,b)=>b.t.localeCompare(a.t))}
}
const dur=ms=>{if(!(ms>0))return'00:00:00';const t=Math.floor(ms/1e3),d=Math.floor(t/86400),p=n=>String(n).padStart(2,'0');return(d?d+'d ':'')+p(Math.floor(t%86400/3600))+':'+p(Math.floor(t%3600/60))+':'+p(t%60)};
setInterval(()=>{if(S.tab!=='abertas'||document.hidden)return;const n=Date.now(),ms=alMs();let ch=0;document.querySelectorAll('.tm').forEach(e=>{const t=+e.dataset.t;e.textContent=dur(n-t);const r=e.closest('tr');if(r&&ms&&t>0&&!r.dataset.al&&n-t>=ms)ch=1});if(ch)sched()},1000);

  const pages=Math.ceil(l.length/PS);

    const hs=hash(cond+'|'+dsc+'|'+data),up=extras(v);if(sn==='CENTRAL'&&S.ab['a'+hs])up['demandas_abertas/a'+hs]=null;
    return{k:'demandas_concluidas/c'+hs,v,up,ek:cond+'|'+dsc+'|'+data.slice(0,16),lb:[fmt(data),uf,cond,dsc,v.responsavel]}}}
};
const cdReady=async()=>{ensureCd();for(let i=0;i<150&&!S.cdDone;i++)await new Promise(r=>setTimeout(r,100))};
const ex=x=>{const[c,...i]=x.k.split('/'),id=i.join('/'),col=S[COL[c]];if(col&&!(c==='demandas_concluidas'&&!S.cdDone)&&col[id])return 1;
  const st=x.ek&&(c==='demandas_abertas'?_ek.ab:_ek.cd);return !!(st&&st.has(x.ek))};
async function modelo(id){const T=IMP[id];await xl();const wb=XLSX.utils.book_new();
  (T.sheets||[id.toUpperCase()]).forEach(n=>{const ws=XLSX.utils.aoa_to_sheet([T.c.map(c=>c[1]),...T.ex]);ws['!cols']=T.c.map((c,j)=>({wch:Math.max(c[1].length+4,14,...T.ex.map(r=>txt(r[j]).length+2))}));XLSX.utils.book_append_sheet(wb,ws,n)});
  const w2=XLSX.utils.aoa_to_sheet([['COLUNA','OBRIGATÓRIA','DESCRIÇÃO','EXEMPLO'],...T.c.map(c=>[c[1],c[2]===1?'SIM':c[2]===2?'SIM*':'NÃO',c[3],c[4]]),[],['REGRAS'],...T.nt.map(n=>[n])]);
  w2['!cols']=[{wch:20},{wch:14},{wch:58},{wch:30}];XLSX.utils.book_append_sheet(wb,w2,'INSTRUCOES');
  XLSX.writeFile(wb,'modelo_'+id+'.xlsx');log('Exportou modelo de importação',T.nome)}
async function lerPlanilha(f,T){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,sheetRows:60000,...(T.sheets?{sheets:T.sheets}:{})});
  const out=[],err=[];let total=0;const names=T.sheets||wb.SheetNames.filter(n=>!/^(INSTRUCOES|LEIAME)$/.test(nrm(n)));
  for(const sn of names){const ws=wb.Sheets[sn];if(!ws)continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});let map,start=0;
    if(T.sheets)map=Object.fromEntries(T.c.map((c,j)=>[c[0],j]));
    else{for(let i=0;i<Math.min(rows.length,6)&&!map;i++){const hs=(rows[i]||[]).map(nrm),m={};
        T.c.forEach(([k,,,,,a])=>{const re=new RegExp('^('+a+')$'),j=hs.findIndex(h=>re.test(h));if(j>=0)m[k]=j});
        if(Object.keys(m).length>=Math.min(2,T.c.length)){map=m;start=i+1}}
      if(!map)map=Object.fromEntries(T.c.map((c,j)=>[c[0],j]));
      const falta=T.c.filter(c=>c[2]===1&&map[c[0]]==null).map(c=>c[1]);
      if(falta.length){err.push({l:1,s:sn,m:'Coluna(s) não encontrada(s): '+falta.join(', ')});continue}}
    for(let i=start;i<rows.length;i++){const r=rows[i]||[];if(!r.some(c=>c!=null&&txt(c)!==''))continue;
      const o={};for(const k in map)o[k]=r[map[k]];const x=T.row(o,sn);if(x.skip)continue;total++;
      if(x.e)err.push({l:i+1,s:sn,m:x.e});else out.push(x)}}
  return{out,err,total,multi:names.length>1}}
async function analisar(id,f){const T=IMP[id];
  $('mod').innerHTML=`<div class="ov"><div class="md vw"><h2 class="vh">Lendo ${esc(f.name)}…</h2><p class="hint">Validando as linhas da planilha.</p><div class="pbar"><i style="width:45%"></i></div></div></div>`;
  try{await xl();await new Promise(r=>setTimeout(r,30));if(T.hist)await cdReady();prepCtx();
    const res=await lerPlanilha(f,T);if(!res.total&&!res.err.length)throw new Error('Nenhuma linha com dados foi encontrada na planilha.');
    prever(id,f,res)}catch(e){fail(e);acts.impt(id)}}
function prever(id,f,res){const T=IMP[id],M=new Map();let dup=0;res.out.forEach(x=>{if(M.has(x.k))dup++;M.set(x.k,x)});
  const L=[...M.values()],N=L.filter(x=>!ex(x)),up={},xu={};
  N.forEach(x=>{up[x.k]=x.v;Object.assign(xu,x.up)});Object.assign(up,xu);
  const cn=p=>Object.keys(xu).filter(k=>k.startsWith(p)&&xu[k]!==null).length,pv=(N.length?N:L).slice(0,6);
  const ext=id==='condominios'||id==='responsaveis'||id==='problemas'?'':[[cn('condominios/'),'condomínio(s)'],[cn('responsaveis/'),'responsável(is)'],[cn('problemas/'),'problema(s)']].filter(a=>a[0]).map(a=>a[0]+' '+a[1]).join(', ');
  const nE=res.err.length;
  $('mod').innerHTML=`<div class="ov"><div class="md vw" style="max-width:680px"><button class="m-x" id="m-c" title="Fechar">&times;</button><div class="vt"><span class="tag">Importar</span></div><h2 class="vh" style="margin-bottom:4px">${T.nome}</h2><p class="hint">${esc(f.name)}</p>
  <div class="st"><div><b>${res.total}</b><label>Linhas lidas</label></div><div class="n"><b>${N.length}</b><label>Novos</label></div><div><b>${L.length-N.length}</b><label>Já existem</label></div><div class="${nE?'e':''}"><b>${nE}</b><label>Com erro</label></div></div>
  ${ext||dup?`<p class="hint" style="margin:12px 0 0">${ext?'Também serão cadastrados: '+ext+'. ':''}${dup?dup+' linha(s) repetida(s) na planilha (vale a última).':''}</p>`:''}
  ${pv.length?`<div class="vs"><label>Pré-visualização</label><div class="mt"><table class="ct"><thead><tr>${T.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${pv.map(x=>`<tr>${x.lb.map(c=>`<td title="${esc(c)}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`:''}
  ${nE?`<div class="vs"><label>Linhas ignoradas</label><ul class="er">${res.err.slice(0,8).map(e=>`<li><b>Linha ${e.l}</b>${res.multi?' · aba '+esc(e.s):''} — ${esc(e.m)}</li>`).join('')}${nE>8?`<li>+ ${nE-8} outra(s)</li>`:''}</ul></div>`:''}
  <div class="ac" id="i-ft"><button class="btn" id="i-b">Voltar</button><button class="btn p" id="i-go" ${N.length?'':'disabled'}>${N.length?'Importar '+N.length+' registro(s)':'Nada novo para importar'}</button></div></div></div>`;
  $('m-c').onclick=closeMod;$('i-b').onclick=()=>acts.impt(id);
  $('i-go').onclick=async()=>{const keys=Object.keys(up);
    $('i-ft').innerHTML=`<div class="pbar" style="flex:1;margin:0 12px 0 0"><i id="i-pb"></i></div><span class="hint" id="i-pt" style="margin:0">0%</span>`;
    try{for(let i=0;i<keys.length;i+=500){const c={};keys.slice(i,i+500).forEach(k=>c[k]=up[k]);await update(R(),c);const q=Math.round(Math.min(i+500,keys.length)/keys.length*100);$('i-pb').style.width=q+'%';$('i-pt').textContent=q+'%'}}
    catch(e){fail(e);return prever(id,f,res)}
    log('Importou '+T.nome.toLowerCase(),`${N.length} registros (${f.name})`);toast(N.length+' registro(s) importado(s)');
    $('mod').innerHTML=`<div class="ov"><div class="md vw" style="max-width:480px"><h2 class="vh">Importação concluída</h2><div class="st"><div class="n"><b>${N.length}</b><label>Importados</label></div><div><b>${L.length-N.length}</b><label>Ignorados (já existiam)</label></div><div class="${nE?'e':''}"><b>${nE}</b><label>Com erro</label></div></div><div class="ac"><button class="btn p" id="i-ok">Fechar</button></div></div></div>`;$('i-ok').onclick=closeMod}}

const renome=(up,col,campo,velho,novo,extra={})=>arr(S.ab).forEach(d=>{if(d[campo]===velho)up['demandas_abertas/'+d.id+'/'+campo]=novo;Object.entries(extra).forEach(([k,v])=>{if(d[campo]===velho)up['demandas_abertas/'+d.id+'/'+k]=v})});

    $('m-c').onclick=closeMod;const dz=$('dz'),inp=dz.querySelector('input'),go=f=>f&&analisar(id,f);inp.onchange=()=>go(inp.files[0]);
    ['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('on')}));
    ['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('on')}));dz.addEventListener('drop',e=>go(e.dataTransfer.files[0]))},
  editc:id=>{const o=S.co[id];if(!o)return;
    modal('Editar Condomínio',[{k:'nome',n:'Nome *',v:o.nome},{k:'uf',n:'UF *',t:'uf',v:o.uf}],v=>{
      v.nome=v.nome.toUpperCase();if(!v.nome||!v.uf||v.uf==='__new'){toast('Preencha nome e UF.',1);return false}if(v.nome===o.nome&&v.uf===o.uf)return;
      const nid='c'+hash(v.nome+v.uf);if(nid!==id&&S.co[nid]){toast('Já existe um condomínio com esse nome nessa UF.',1);return false}
      const up={};if(nid!==id)up['condominios/'+id]=null;up['condominios/'+nid]=v;up['ufs/'+v.uf]=true;
      arr(S.ab).forEach(d=>{if(d.condominio===o.nome&&d.uf===o.uf){up['demandas_abertas/'+d.id+'/condominio']=v.nome;up['demandas_abertas/'+d.id+'/uf']=v.uf}});
      update(R(),up).catch(fail);log('Editou condomínio',`${o.nome} (${o.uf}) → ${v.nome} (${v.uf})`);toast('Salvo. Demandas abertas atualizadas; o histórico mantém o nome antigo.')})},
  editr:id=>{const o=S.rs[id];if(!o)return;
    modal('Editar Responsável',[{k:'nome',n:'Nome *',v:o.nome}],v=>{
      v.nome=v.nome.toUpperCase();if(!v.nome){toast('Informe o nome.',1);return false}if(v.nome===o.nome)return;
      const nid='r'+hash(v.nome);if(nid!==id&&S.rs[nid]){toast('Já existe um responsável com esse nome.',1);return false}

      update(R(),up).catch(fail);log('Editou responsável',`${o.nome} → ${v.nome}`);toast('Salvo')})},
  editp:id=>{const o=S.pb[id];if(!o)return;
    modal('Editar Problema',[{k:'nome',n:'Nome *',v:o.nome}],v=>{
      v.nome=v.nome.toUpperCase();if(!v.nome){toast('Informe o nome.',1);return false}if(v.nome===o.nome)return;
      const nid='p'+hash(v.nome);if(nid!==id&&(S.pb[nid]||PROBS.includes(v.nome))){toast('Já existe um problema com esse nome.',1);return false}
      const up={};if(nid!==id)up['problemas/'+id]=null;up['problemas/'+nid]={nome:v.nome};renome(up,0,'problema',o.nome,v.nome);
      update(R(),up).catch(fail);log('Editou problema',`${o.nome} → ${v.nome}`);toast('Salvo')})},
  editu:id=>{const o=S.us[id];if(!o)return;const self=id===S.user.id;

  cfgal:()=>{if(!admin())return;const c=S.cfg?.alerta||{};let v=+c.valor>0?+c.valor:0,u=UN[c.unidade]?c.unidade:'horas';

document.addEventListener('input',e=>{const m=$('m-er');if(m&&e.target.closest('#mod'))m.textContent=''});

(()=>{const L=$('list');
