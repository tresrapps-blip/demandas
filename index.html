    {k:'status',n:'Status',t:'select',o:STATUS,v:d.status||'CENTRAL'},{k:'prioridade',n:'Prioridade',t:'select',o:['NORMAL','PRIORIDADE'],v:d.prioridade==='SIM'?'PRIORIDADE':'NORMAL'},{k:'tratativa',n:'Tratativa / Observação',t:'area',v:d.tratativa}],
  async v=>{
    v.problema=(v.problema==='__new'?'':v.problema||'').toUpperCase();v.prioridade=v.prioridade==='PRIORIDADE'?'SIM':'';if(d.prioridade==='SIM'&&!v.prioridade&&!await askYes(...PQ))return false;v.condominio=v.condominio.toUpperCase();v.descricao=v.descricao.toUpperCase();v.responsavel=v.responsavel.toUpperCase();
    if(!v.condominio||!v.uf||!v.descricao){toast('Preencha condomínio, UF e descrição.',1);return false}
    if(v.problema&&!probNames().includes(v.problema)){update(R('problemas/p'+hash(v.problema)),{nome:v.problema}).catch(fail);log('Cadastrou problema',v.problema)}
    const{id:_,...rest}=d,id=d.id||genId(),up={};

    const diff=d.id?Object.keys(v).filter(k=>(d[k]||'')!==v[k]).map(k=>`${k}: "${d[k]||''}" → "${v[k]}"`).join('; '):'';
    update(R(),up).catch(fail);log(d.id?'Editou demanda':'Criou demanda',`${v.condominio} - ${v.descricao}${diff?' | '+diff:''}`);toast('Salvo');
  });
}
function concluir(id){
  const d=S.ab[id];if(!d)return;

/* ---------- Ações ---------- */

    $('m-c').onclick=closeMod;log('Visualizou demanda',desc(d))},
  reopen:(id)=>{const d=S.cd[id];if(!d||!confirm('Reabrir esta demanda?'))return;const{dataConclusao,...r}=d;
    update(R(),{['demandas_concluidas/'+id]:null,['demandas_abertas/'+id]:r}).catch(fail);log('Reabriu demanda',desc(d))},

    update(R(),{[k+'/'+id]:null}).catch(fail);log('Excluiu '+k.replace('_',' '),desc(o)+(o?.tratativa?' | tratativa: '+o.tratativa:''))},
  novoc:()=>modal('Novo Condomínio',[{k:'nome',n:'Nome *'},{k:'uf',n:'UF *',t:'uf'}],v=>{v.nome=v.nome.toUpperCase();if(!v.nome||!v.uf){toast('Preencha nome e UF.',1);return false}
    update(R('condominios/c'+hash(v.nome+v.uf)),v).catch(fail);log('Cadastrou condomínio',v.nome+' ('+v.uf+')')}),
  novop:()=>modal('Novo Problema',[{k:'nome',n:'Nome *'}],v=>{v.nome=v.nome.toUpperCase();if(!v.nome)return false;update(R('problemas/p'+hash(v.nome)),v).catch(fail);log('Cadastrou problema',v.nome)}),
  novor:()=>modal('Novo Responsável',[{k:'nome',n:'Nome *'}],v=>{v.nome=v.nome.toUpperCase();if(!v.nome)return false;update(R('responsaveis/r'+hash(v.nome)),v).catch(fail);log('Cadastrou responsável',v.nome)}),
  novou:()=>modal('Novo Usuário',[{k:'nome',n:'Nome *'},{k:'email',n:'E-mail * (somente @servis.com)'},{k:'senha',n:'Senha *',t:'password'},{k:'perfil',n:'Perfil',t:'select',o:['observador','editor','admin']}],async v=>{
    if(!v.nome||!v.email||!v.senha){toast('Preencha todos os campos.',1);return false}
    v.email=mail(v.email);if(!okMail(v.email)){toast('O e-mail deve ser @servis.com.',1);return false}
    update(R('usuarios/u'+hash(v.email.toLowerCase())),{nome:v.nome.toUpperCase(),email:v.email.toLowerCase(),perfil:v.perfil,senha:await sha(v.senha)}).catch(fail);log('Cadastrou usuário',v.email+' ('+v.perfil+')')}),
  import:()=>{closeMod();const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>i.files[0]&&importar(i.files[0]);i.click()},
  importc:()=>{closeMod();const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>i.files[0]&&importarCond(i.files[0]);i.click()},
  export:async(id)=>{
    closeMod();const t=id,m={abertas:x=>({DATA:fmt(x.data),UF:x.uf,CONDOMINIO:x.condominio,DESCRICAO:x.descricao,PROBLEMA:x.problema,RESPONSAVEL:x.responsavel,STATUS:x.status,PRIORIDADE:x.prioridade,TRATATIVA:x.tratativa}),
      concluidas:x=>({DATA:fmt(x.data),CONCLUSAO:fmt(x.dataConclusao),UF:x.uf,CONDOMINIO:x.condominio,DESCRICAO:x.descricao,PROBLEMA:x.problema,RESPONSAVEL:x.responsavel,TRATATIVA:x.tratativa,TECNICO:x.tecnico,TRATATIVA_SAC:x.tratativaSac}),
      condominios:x=>({NOME:x.nome,UF:x.uf}),responsaveis:x=>({NOME:x.nome})}[t];if(!m)return;
    try{await xl()}catch(e){return fail(e)}
    if(t==='concluidas'&&!S.cdDone){ensureCd();toast('Carregando histórico…');for(let i=0;i<200&&!S.cdDone;i++)await new Promise(r=>setTimeout(r,100))}
    const l=t==='abertas'?prep(S.ab):t==='concluidas'?cdArr():arr(t==='condominios'?S.co:S.rs).sort((a,b)=>a.nome.localeCompare(b.nome)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(l.map(m)),t.slice(0,30));
    XLSX.writeFile(wb,`${t}_${new Date().toISOString().slice(0,10)}.xlsx`);log('Exportou '+NAMES[t],l.length+' registros');

document.addEventListener('click',e=>{
  if(e.target.classList.contains('ov')){closeMod();return}
  if(!e.target.closest('#menu')&&!e.target.closest('[data-act=menu]'))$('menu').classList.add('hide');
  if(e.target.closest('#menu button'))$('menu').classList.add('hide');
  const a=e.target.closest('[data-act]');if(a)acts[a.dataset.act]?.(a.dataset.id,a)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});

/* ---------- Importar Excel (direto para o histórico) ---------- */
const txt=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
const toISO=v=>{if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString();const d=new Date(v);return v&&!isNaN(d)?d.toISOString():''};
async function importarCond(f){
  try{toast('Lendo planilha…');await xl();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
    const m=new Map();let bad=0;
    rows.forEach((r,i)=>{const n=txt(r[0]).toUpperCase(),u=txt(r[1]).toUpperCase();
      if(!n)return;if(i===0&&/^(COND(OM[IÍ]NIO)?S?|NOME.*)$/.test(n))return;
      if(!/^[A-Z]{2}$/.test(u)){bad++;return}m.set(n+'|'+u,{nome:n,uf:u})});
    if(!m.size)return toast('Nenhum condomínio válido. Use coluna A = nome e coluna B = UF (2 letras).',1);
    const novos=[...m.values()].filter(c=>!S.co['c'+hash(c.nome+c.uf)]).length;
    if(!await askYes('Importar condomínios',`${m.size} condomínio(s) na planilha, sendo <b>${novos}</b> novo(s).${bad?`<br>${bad} linha(s) sem UF válida serão ignoradas.`:''}`,'Importar'))return;
    const up={};m.forEach(c=>{up['condominios/c'+hash(c.nome+c.uf)]=c;up['ufs/'+c.uf]=true});
    const keys=Object.keys(up);for(let i=0;i<keys.length;i+=500){const c={};keys.slice(i,i+500).forEach(k=>c[k]=up[k]);await update(R(),c)}
    log('Importou condomínios',`${m.size} registros (${f.name})`);toast(`${novos} condomínio(s) novo(s) importado(s).`);
  }catch(err){fail(err)}
}
async function importar(f){
  try{
    toast('Lendo planilha… (arquivos grandes podem levar alguns segundos)');await xl();await new Promise(r=>setTimeout(r,50));
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,sheets:['CENTRAL','CONCLUIDO'],sheetRows:60000});
    const pick=(sh,pre)=>{const out={};XLSX.utils.sheet_to_json(wb.Sheets[sh]||{},{header:1,raw:true,defval:null}).forEach(r=>{
      const cond=txt(r[1]).toUpperCase();if(!cond||/^COND(OM[IÍ]NIO)?$/.test(cond))return;
      let uf=txt(r[0]).toUpperCase();if(!/^[A-Z]{2}$/.test(uf))uf='';
      const data=toISO(r[6]),desc=txt(r[2]).toUpperCase();
      out[pre+hash(cond+'|'+desc+'|'+data)]=clean({uf,condominio:cond,descricao:desc,problema:txt(r[3]).toUpperCase(),responsavel:txt(r[4]).toUpperCase().replace('NONE',''),status:txt(r[5]).toUpperCase().replace('CONCLUIDO','')||'CENTRAL',data,dataConclusao:data,tratativa:txt(r[7]).toUpperCase(),tecnico:txt(r[8]).toUpperCase(),tratativaSac:txt(r[9]).toUpperCase()})});return out};
    const old=pick('CENTRAL','a'),cd={...pick('CENTRAL','c'),...pick('CONCLUIDO','c')},nc=Object.keys(cd).length;
    if(!nc)return toast('Não encontrei abas CENTRAL/CONCLUIDO com dados.',1);
    if(!confirm(`Importar ${nc} registro(s) direto para o histórico (Concluídas)?\n(Reimportar o mesmo arquivo não duplica registros.)`))return;
    const up={};Object.entries(cd).forEach(([k,v])=>up['demandas_concluidas/'+k]=v);Object.keys(old).forEach(k=>{if(S.ab[k])up['demandas_abertas/'+k]=null});
    Object.values(cd).forEach(v=>{if(v.uf){up['ufs/'+v.uf]=true;up['condominios/c'+hash(v.condominio+v.uf)]={nome:v.condominio,uf:v.uf}}if(v.responsavel)up['responsaveis/r'+hash(v.responsavel)]={nome:v.responsavel}});
    const keys=Object.keys(up);for(let i=0;i<keys.length;i+=500){const c={};keys.slice(i,i+500).forEach(k=>c[k]=up[k]);await update(R(),c);toast(`Enviando… ${Math.min(i+500,keys.length)}/${keys.length}`)}
    log('Importou planilha',`${nc} registros para o histórico (${f.name})`);toast(`Importação concluída: ${nc} registros no histórico.`);
  }catch(err){fail(err)}
}

/* ---------- Chat interno (tempo real) ---------- */
const cw=$('chat'),pk=(a,b)=>[a,b].sort().join('_'),att=new Set();let cur=null,startTs=Date.now();
const others=()=>arr(S.us).filter(u=>u.id!==S.user?.id).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
const msgs=u=>Object.entries(S.ch[pk(S.user.id,u)]||{}).map(([id,m])=>({id,...m})).sort((a,b)=>a.data<b.data?-1:1);
const unread=u=>Object.values(S.ch[pk(S.user.id,u)]||{}).filter(m=>m.para===S.user.id&&!m.lida).length;
const isOpen=()=>cw.classList.contains('on');
const first={};
function attachAll(){
  if(!S.user)return;
  others().forEach(u=>{if(att.has(u.id))return;att.add(u.id);const k=pk(S.user.id,u.id);
    onValue(query(R('chat/'+k),limitToLast(60)),s=>{const nv=s.val()||{},old=S.ch[k]||{},ready=first[k];first[k]=1;S.ch[k]=nv;
      if(ready)Object.entries(nv).forEach(([id,m])=>{if(!old[id])incoming(u.id,m)});
      later('ch',saveCh);chatUpd()},fail)});
  chatUpd();
}
function incoming(uid,m){
  if(m.para!==S.user.id)return;
  if(isOpen()&&cur===uid&&document.hasFocus()){markRead(uid);return}
  const u=S.us[uid],nome=u?.nome||m.deNome||'Mensagem';
  const n=document.createElement('div');n.className='nt';n.innerHTML=`<b>${esc(nome)}</b><span>${esc(m.texto.slice(0,90))}</span>`;
  n.onclick=()=>{n.remove();chatOpen(uid)};$('nts').appendChild(n);setTimeout(()=>n.remove(),7000);
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}
  try{if(document.hidden&&Notification.permission==='granted')new Notification(nome,{body:m.texto.slice(0,120),icon:FAV})}catch(e){}
}
function markRead(uid){
  const k=pk(S.user.id,uid),up={};
  Object.entries(S.ch[k]||{}).forEach(([id,m])=>{if(m.para===S.user.id&&!m.lida){m.lida=true;up[`chat/${k}/${id}/lida`]=true}});
  if(Object.keys(up).length){update(R(),up).catch(()=>{});chatUpd()}
}
function chatUpd(){
  if(!S.user)return;
  const tot=others().reduce((n,u)=>n+unread(u.id),0);
  ['c-n1','c-n2','c-n3'].forEach(i=>{$(i).textContent=tot;$(i).classList.toggle('hide',!tot)});
  document.title=(tot?`(${tot}) `:'')+'Demandas Servis';
  if(!isOpen())return;
  $('ch-u').innerHTML='<div class="ch-uh">Usuários</div>'+(others().map(u=>{const n=unread(u.id);return `<div class="ch-ui${cur===u.id?' on':''}" data-act="cuser" data-id="${u.id}"><div class="av">${esc((u.nome||'?')[0])}${S.pr[u.id]?'<i class="dot"></i>':''}</div><div class="n">${esc(u.nome)}</div>${n?`<b class="nb">${n}</b>`:''}</div>`}).join('')||'<div class="ch-e">Nenhum outro usuário</div>');
  const u=cur&&S.us[cur],ms=$('ch-ms');
  $('ch-ch').innerHTML=u?`<div class="av">${esc((u.nome||'?')[0])}${S.pr[cur]?'<i class="dot"></i>':''}</div>${esc(u.nome)}`:'Selecione um usuário';
  $('c-in').disabled=$('c-go').disabled=!u;
  if(!u){ms.innerHTML='<div class="ch-e">Selecione um usuário para iniciar a conversa</div>';return}
  const l=msgs(cur),atEnd=ms.scrollHeight-ms.scrollTop-ms.clientHeight<60;
  ms.innerHTML=l.length?l.map(m=>{const own=m.de===S.user.id,d=new Date(m.data),t=d.toDateString()===new Date().toDateString()?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
    return `<div class="mg${own?' own':''}"><div class="bb">${esc(m.texto)}</div><div class="mt">${own?'Você':esc(m.deNome||'')} · ${t}</div></div>`}).join(''):'<div class="ch-e">Nenhuma mensagem ainda. Digite algo para começar.</div>';
  if(atEnd||l.length)ms.scrollTop=ms.scrollHeight;
}
function chatOpen(uid){
  cw.classList.add('on');try{const p=JSON.parse(localStorage.getItem('ds_chat')||'null');if(p){Object.assign(cw.style,{left:p.left,top:p.top,width:p.w,height:p.h,right:'auto',bottom:'auto'})}}catch(e){}
  if(uid)cur=uid;if(cur)markRead(cur);chatUpd();$('c-in').focus();
  try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}
}
const chatMin=()=>{cw.classList.remove('on');chatUpd()};
function chatExpand(){const x=cw.dataset.x==='1';cw.dataset.x=x?'0':'1';Object.assign(cw.style,x?{width:'440px',height:'480px',left:'auto',top:'auto',right:'20px',bottom:'20px'}:{width:'70vw',height:'80vh',left:'15vw',top:'10vh',right:'auto',bottom:'auto'})}
function chatSelect(id){cur=id;markRead(id);chatUpd();$('c-in').focus()}
function chatSend(){
  const i=$('c-in'),t=i.value.trim();if(!t||!cur)return;i.value='';
  push(R('chat/'+pk(S.user.id,cur)),{de:S.user.id,deNome:S.user.nome,para:cur,texto:t.slice(0,2000),data:new Date().toISOString(),lida:false}).catch(fail);
}
$('c-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend()}});
window.addEventListener('focus',()=>{if(isOpen()&&cur)markRead(cur)});
{const h=$('ch-h');let d=null;
 h.onpointerdown=e=>{if(e.target.closest('button'))return;const r=cw.getBoundingClientRect();d={x:e.clientX-r.left,y:e.clientY-r.top};h.setPointerCapture(e.pointerId);Object.assign(cw.style,{right:'auto',bottom:'auto',left:r.left+'px',top:r.top+'px'})};
 h.onpointermove=e=>{if(!d)return;cw.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-d.x))+'px';cw.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-d.y))+'px'};
 h.onpointerup=()=>{if(!d)return;d=null;const r=cw.getBoundingClientRect();localStorage.setItem('ds_chat',JSON.stringify({left:r.left+'px',top:r.top+'px',w:r.width+'px',h:r.height+'px'}))}}

themeUI();listen();
{let sess=null;try{sess=JSON.parse(localStorage.getItem('ds_user'))}catch(e){}
 if(sess&&sess.id)enter(sess);else initLogin()}
