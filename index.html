<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandas Servis</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ds_theme')||'dark'}catch(e){}</script>
<style>
:root{--bg:#1c1c20;--bg2:#141417;--card:#222226;--hov:#2a2a30;--bd:#34343a;--tx:#e6e6e8;--tx2:#8d8d96;--pr:#4ade80;--prt:#07200f;--dg:#f87171}
[data-theme=light]{--bg:#f4f4f6;--bg2:#fff;--card:#fff;--hov:#ececef;--bd:#d8d8de;--tx:#202024;--tx2:#666;--pr:#16a34a;--prt:#fff;--dg:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:13px;height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:56px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.lg{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.logo{height:36px;width:auto;display:block}.lb .logo{height:96px}
.hr{display:flex;align-items:center;gap:4px}
.ib{background:none;border:0;color:var(--tx2);cursor:pointer;padding:8px;display:inline-flex;position:relative}.ib:hover{color:var(--tx)}
.user{line-height:1.15;padding:0 8px}.user small{display:block;color:var(--tx2);font-size:10px}
nav{display:flex;gap:6px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto}
nav a{padding:14px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
nav a.on{color:var(--pr);border-color:var(--pr)}.bd{color:var(--tx2);font-size:11px;margin-left:6px}
main{flex:1;overflow:auto;padding:16px 24px;width:100%;max-width:1700px;margin:0 auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sp{flex:1}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 10px;font-size:13px;outline:0;width:100%}
#bar input,#bar select{width:auto;min-width:130px}#bar input{min-width:260px}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
.btn{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--hov)}.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}.btn.d{color:var(--dg)}.btn.s{padding:3px 8px;font-size:12px}
.tw{border:1px solid var(--bd);overflow:auto;max-height:calc(100vh - 220px)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;letter-spacing:.5px;color:var(--tx2);text-transform:uppercase}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}td{background:var(--bg2)}tr:hover td{background:var(--hov)}tr[data-act=view]{cursor:pointer}
.tag{border:1px solid var(--bd);color:var(--tx2);padding:1px 6px;font-size:11px;font-weight:600}
.emp{padding:60px;text-align:center;color:var(--tx2);border:1px solid var(--bd)}.emp b{display:block;color:var(--tx);margin-bottom:6px}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;color:var(--tx2)}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--card);border:1px solid var(--bd);padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.md h2{font-size:16px;margin-bottom:14px}.fg{margin-bottom:12px}.fg label{display:block;color:var(--tx2);font-size:12px;margin-bottom:4px}
.ac{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dr{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd)}.dr span{width:110px;flex:none;color:var(--tx2)}.dr b{font-weight:500;white-space:pre-wrap;word-break:break-word}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
.lb{background:var(--card);border:1px solid var(--bd);padding:32px;width:360px}
.lb .lg{justify-content:center;margin-bottom:16px}.lb h1{font-size:15px;text-align:center;margin-bottom:16px}.lb .fg input{padding:10px}
#toast{position:fixed;left:16px;bottom:16px;background:var(--card);border:1px solid var(--pr);padding:10px 16px;z-index:200;max-width:380px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}#toast.er{border-color:var(--dg)}
/* chat */
.nb{position:absolute;top:2px;right:0;background:var(--dg);color:#fff;font-size:9px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 3px;font-weight:700}
#chat{position:fixed;right:20px;bottom:20px;width:440px;height:480px;min-width:340px;min-height:300px;max-width:96vw;max-height:94vh;background:var(--bg2);border:1px solid var(--bd);box-shadow:0 8px 28px #0006;z-index:60;display:none;flex-direction:column;resize:both;overflow:hidden}
#chat.on{display:flex}#chat.on~#launch{display:none}
#launch{position:fixed;right:20px;bottom:20px;width:40px;height:40px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);display:grid;place-items:center;cursor:pointer;z-index:59}
.ch-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid var(--bd);cursor:move;user-select:none;font-weight:600}
.ch-m{flex:1;display:flex;min-height:0}
.ch-u{width:140px;flex:none;border-right:1px solid var(--bd);overflow:auto}
.ch-uh{padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);border-bottom:1px solid var(--bd)}
.ch-ui{display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}.ch-ui:hover{background:var(--hov)}.ch-ui.on{background:var(--hov);box-shadow:inset 2px 0 var(--pr)}
.ch-ui .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch-ui .nb{position:static}
.av{width:22px;height:22px;flex:none;border:1px solid var(--bd);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--tx2);position:relative}
.dot{position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;background:var(--pr)}
.ch-c{flex:1;display:flex;flex-direction:column;min-width:0}
.ch-ch{padding:8px 10px;font-weight:700;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;min-height:38px}
.ch-ms{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.ch-e{text-align:center;color:var(--tx2);font-style:italic;padding:20px 10px;font-size:12px}
.mg{max-width:85%;align-self:flex-start}.mg.own{align-self:flex-end;text-align:right}
.bb{padding:6px 9px;background:var(--hov);white-space:pre-wrap;word-break:break-word;text-align:left;display:inline-block}.own .bb{background:color-mix(in srgb,var(--pr) 22%,transparent)}
.mt{font-size:10px;color:var(--tx2);margin-top:2px}
.ch-i{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.ch-i textarea{resize:none;height:36px}
#nts{position:fixed;top:64px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.nt{background:var(--card);border:1px solid var(--pr);padding:10px 14px;cursor:pointer;max-width:320px}.nt b{display:block}.nt span{color:var(--tx2);font-size:12px}
</style>
</head>
<body>
<div id="login"><div class="lb">
  <div class="lg"><img class="logo" data-logo alt="Servis"></div>
  <h1 id="l-t">Acesso ao Sistema</h1>
  <div class="fg hide" id="l-n"><input id="l-nome" placeholder="Seu nome"></div>
  <div class="fg"><input id="l-email" type="email" placeholder="E-mail"></div>
  <div class="fg"><input id="l-pass" type="password" placeholder="Senha"></div>
  <button class="btn p" style="width:100%" id="l-go">Entrar</button>
  <p id="l-err" style="color:var(--dg);margin-top:12px;font-size:12px"></p>
</div></div>

<header>
  <div class="lg"><img class="logo" data-logo alt="Servis">Demandas Servis</div>
  <div class="hr">
    <button class="ib" data-act="chat" title="Chat"><i data-i="chat"></i><b class="nb hide" id="c-n1"></b></button>
    <button class="ib" data-act="theme" title="Tema"><i data-i="moon"></i></button>
    <span class="user"><b id="u-n">-</b><small id="u-p"></small></span>
    <button class="ib" data-act="logout" title="Sair"><i data-i="out"></i></button>
  </div>
</header>
<nav id="nav"></nav>
<main><div id="bar"></div><div id="list"></div></main>
<div id="mod"></div><div id="toast"></div><div id="nts"></div>

<div id="chat">
  <div class="ch-h" id="ch-h"><span>Chat interno</span><span><button class="ib" data-act="cexp" title="Expandir"><i data-i="exp"></i></button><button class="ib" data-act="cmin" title="Minimizar"><i data-i="min"></i></button></span></div>
  <div class="ch-m">
    <div class="ch-u" id="ch-u"></div>
    <div class="ch-c"><div class="ch-ch" id="ch-ch">Selecione um usuário</div><div class="ch-ms" id="ch-ms"><div class="ch-e">Selecione um usuário para iniciar a conversa</div></div>
      <div class="ch-i"><textarea id="c-in" placeholder="Digite sua mensagem…" disabled></textarea><button class="btn p" id="c-go" data-act="csend" disabled>Enviar</button></div></div>
  </div>
</div>
<div id="launch" data-act="chat"><i data-i="chat"></i><b class="nb hide" id="c-n2"></b></div>

const arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));

const sub=(p,k,cb)=>onValue(R(p),s=>{S[k]=s.val()||{};cb?.();sched()},fail);
function listen(){
  sub('demandas_abertas','ab');sub('condominios','co');sub('responsaveis','rs');sub('ufs','ux');
  sub('usuarios','us',attachAll);
  onValue(R('presenca'),s=>{S.pr=s.val()||{};chatUpd()});
  update(R('presenca'),{[S.user.id]:true}).catch(()=>{});onDisconnect(R('presenca/'+S.user.id)).remove();
}
function lazy(tab){
  if(tab==='concluidas'&&!S.cdOn){S.cdOn=1;onValue(R('demandas_concluidas'),s=>{S.cd=s.val()||{};S.cdArr=null;S.cdDone=1;sched()},fail)}

}

/* ---------- Login ---------- */
let setup=false;
async function initLogin(){
  try{S.us=(await get(R('usuarios'))).val()||{};setup=!Object.keys(S.us).length}catch(e){$('l-err').textContent='Sem acesso ao Firebase: '+e.message;return}
  $('l-n').classList.toggle('hide',!setup);$('l-t').textContent=setup?'Primeiro acesso: crie o administrador':'Acesso ao Sistema';$('l-go').textContent=setup?'Criar e entrar':'Entrar';
  const id=localStorage.getItem('ds_uid');if(id&&S.us[id]&&!setup)enter({id,...S.us[id]});
}
async function doLogin(){
  const email=$('l-email').value.trim().toLowerCase(),pw=$('l-pass').value,err=$('l-err');err.textContent='';
  if(!email||!pw)return err.textContent='Informe e-mail e senha.';
  const h=await sha(pw);
  if(setup){
    const nome=$('l-nome').value.trim().toUpperCase();if(!nome)return err.textContent='Informe seu nome.';
    const u={nome,email,perfil:'admin',senha:h},id='u'+hash(email);
    try{await update(R('usuarios/'+id),u)}catch(e){return err.textContent=e.message}
    return enter({id,...u});
  }
  const u=arr(S.us).find(x=>(x.email||'').toLowerCase()===email);
  if(!u||(u.senha&&u.senha!==h)){log('Falha de login',email,email);return err.textContent='E-mail ou senha incorretos.'}
  if(!u.senha)update(R('usuarios/'+u.id),{senha:h}).catch(()=>{});
  enter(u);
}
function enter(u){
  S.user=u;localStorage.setItem('ds_uid',u.id);$('login').classList.add('hide');
  $('u-n').textContent=u.nome;$('u-p').textContent=(u.perfil||'').toUpperCase();
  listen();log('Login');renderBar();render();
}
$('l-go').onclick=doLogin;$('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

const prep=o=>arr(o).map(x=>(x._t=new Date(x.dataConclusao||x.data||0).getTime()||0,x._s=[x.condominio,x.descricao,x.problema,x.responsavel,x.tratativa,x.tecnico,x.uf].join(' ').toLowerCase(),x)).sort((a,b)=>b._t-a._t);
const cdArr=()=>S.cdArr||(S.cdArr=prep(S.cd));
const hit=(o,q)=>!q||Object.values(o).join(' ').toLowerCase().includes(q);
function rows(){
  const q=S.q.toLowerCase(),t=S.tab;
  if(t==='abertas'||t==='concluidas')return(t==='abertas'?prep(S.ab):cdArr()).filter(x=>(!q||x._s.includes(q))&&(!S.uf||x.uf===S.uf)&&(!S.st||x.status===S.st));
  if(t==='condominios')return arr(S.co).filter(x=>hit(x,q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(t==='responsaveis')return arr(S.rs).filter(x=>hit(x,q)).sort((a,b)=>a.nome.localeCompare(b.nome));

  const first=$('mod').querySelector('input,textarea');first&&first.focus();

/* ---------- Importar Excel (direto para o histórico) ---------- */
const txt=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
const toISO=v=>{if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString();const d=new Date(v);return v&&!isNaN(d)?d.toISOString():''};
async function importar(f){
  try{
    toast('Lendo planilha… (arquivos grandes podem levar alguns segundos)');await xl();await new Promise(r=>setTimeout(r,50));
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,sheets:['CENTRAL','CONCLUIDO'],sheetRows:60000});
    const pick=(sh,pre)=>{const out={};XLSX.utils.sheet_to_json(wb.Sheets[sh]||{},{header:1,raw:true,defval:null}).forEach(r=>{
      const cond=txt(r[1]).toUpperCase();if(!cond||/^COND(OM[IÍ]NIO)?$/.test(cond))return;
      let uf=txt(r[0]).toUpperCase();if(!/^[A-Z]{2}$/.test(uf))uf='';
      const data=toISO(r[6]),desc=txt(r[2]).toUpperCase();
      out[pre+hash(cond+'|'+desc+'|'+data)]=clean({uf,condominio:cond,descricao:desc,problema:txt(r[3]).toUpperCase(),responsavel:txt(r[4]).toUpperCase().replace('NONE',''),status:txt(r[5]).toUpperCase().replace('CONCLUIDO','')||'CENTRAL',data,dataConclusao:data,tratativa:txt(r[7]).toUpperCase(),tecnico:txt(r[8]).toUpperCase(),tratativaSac:txt(r[9]).toUpperCase()})});return out};
    const old=pick('CENTRAL','a'),cd={...pick('CENTRAL','c'),...pick('CONCLUIDO','c')},nc=Object.keys(cd).length;
    if(!nc)return toast('Não encontrei abas CENTRAL/CONCLUIDO com dados.',1);
    if(!confirm(`Importar ${nc} registro(s) direto para o histórico (Concluídas)?\n(Reimportar o mesmo arquivo não duplica registros.)`))return;
    const up={};Object.entries(cd).forEach(([k,v])=>up['demandas_concluidas/'+k]=v);Object.keys(old).forEach(k=>{if(S.ab[k])up['demandas_abertas/'+k]=null});
    Object.values(cd).forEach(v=>{if(v.uf){up['ufs/'+v.uf]=true;up['condominios/c'+hash(v.condominio+v.uf)]={nome:v.condominio,uf:v.uf}}if(v.responsavel)up['responsaveis/r'+hash(v.responsavel)]={nome:v.responsavel}});
    const keys=Object.keys(up);for(let i=0;i<keys.length;i+=500){const c={};keys.slice(i,i+500).forEach(k=>c[k]=up[k]);await update(R(),c);toast(`Enviando… ${Math.min(i+500,keys.length)}/${keys.length}`)}
    log('Importou planilha',`${nc} registros para o histórico (${f.name})`);toast(`Importação concluída: ${nc} registros no histórico.`);
  }catch(err){fail(err)}
}

function incoming(uid,m){

  const u=S.us[uid],nome=u?.nome||m.deNome||'Mensagem';

  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}
  try{if(document.hidden&&Notification.permission==='granted')new Notification(nome,{body:m.texto.slice(0,120),icon:FAV})}catch(e){}

function markRead(uid){

  const u=cur&&S.us[cur],ms=$('ch-ms');
  $('ch-ch').innerHTML=u?`<div class="av">${esc((u.nome||'?')[0])}${S.pr[cur]?'<i class="dot"></i>':''}</div>${esc(u.nome)}`:'Selecione um usuário';
  $('c-in').disabled=$('c-go').disabled=!u;
  if(!u){ms.innerHTML='<div class="ch-e">Selecione um usuário para iniciar a conversa</div>';return}
  const l=msgs(cur),atEnd=ms.scrollHeight-ms.scrollTop-ms.clientHeight<60;
  ms.innerHTML=l.length?l.map(m=>{const own=m.de===S.user.id,d=new Date(m.data),t=d.toDateString()===new Date().toDateString()?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
    return `<div class="mg${own?' own':''}"><div class="bb">${esc(m.texto)}</div><div class="mt">${own?'Você':esc(m.deNome||'')} · ${t}</div></div>`}).join(''):'<div class="ch-e">Nenhuma mensagem ainda. Digite algo para começar.</div>';
  if(atEnd||l.length)ms.scrollTop=ms.scrollHeight;
}
function chatOpen(uid){
  cw.classList.add('on');try{const p=JSON.parse(localStorage.getItem('ds_chat')||'null');if(p){Object.assign(cw.style,{left:p.left,top:p.top,width:p.w,height:p.h,right:'auto',bottom:'auto'})}}catch(e){}
  if(uid)cur=uid;if(cur)markRead(cur);chatUpd();$('c-in').focus();
  try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}
}
const chatMin=()=>{cw.classList.remove('on');chatUpd()};
function chatExpand(){const x=cw.dataset.x==='1';cw.dataset.x=x?'0':'1';Object.assign(cw.style,x?{width:'440px',height:'480px',left:'auto',top:'auto',right:'20px',bottom:'20px'}:{width:'70vw',height:'80vh',left:'15vw',top:'10vh',right:'auto',bottom:'auto'})}
function chatSelect(id){cur=id;markRead(id);chatUpd();$('c-in').focus()}
function chatSend(){
  const i=$('c-in'),t=i.value.trim();if(!t||!cur)return;i.value='';
  push(R('chat/'+pk(S.user.id,cur)),{de:S.user.id,deNome:S.user.nome,para:cur,texto:t.slice(0,2000),data:new Date().toISOString(),lida:false}).catch(fail);
}
$('c-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend()}});
window.addEventListener('focus',()=>{if(isOpen()&&cur)markRead(cur)});
{const h=$('ch-h');let d=null;
 h.onpointerdown=e=>{if(e.target.closest('button'))return;const r=cw.getBoundingClientRect();d={x:e.clientX-r.left,y:e.clientY-r.top};h.setPointerCapture(e.pointerId);Object.assign(cw.style,{right:'auto',bottom:'auto',left:r.left+'px',top:r.top+'px'})};
 h.onpointermove=e=>{if(!d)return;cw.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-d.x))+'px';cw.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-d.y))+'px'};
 h.onpointerup=()=>{if(!d)return;d=null;const r=cw.getBoundingClientRect();localStorage.setItem('ds_chat',JSON.stringify({left:r.left+'px',top:r.top+'px',w:r.width+'px',h:r.height+'px'}))}}

initLogin();
</script>
